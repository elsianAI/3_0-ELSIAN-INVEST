ay:flex}.sheet{width:100%;background:white;border-radius:22px 22px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 32px #0004}.sheet h2{font-size:19px;margin:0}.sub{font-size:10px;color:#708196;margin:4px 0 13px}.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.plan div{border:1px solid var(--l);background:#f5f8fb;border-radius:12px;padding:11px 6px;text-align:center}.plan span{display:block;font-size:8px;color:#748498;text-transform:uppercase}.plan strong{display:block;font-size:15px;margin-top:6px}.tp{background:#eaf7f1!important}.tp strong{color:var(--g)}.sl{background:#fdebed!important}.sl strong{color:var(--r)}.sheet p{font-size:10px;color:#60748a;line-height:1.55;background:#f7f9fc;padding:10px;border-radius:10px}.sheet button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--b);color:white;font-weight:900}@media(min-width:900px){header>*,.global{max-width:1450px;margin-left:auto;margin-right:auto}#cards{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1500px;margin:auto}.global{top:88px}}body.force-mobile{max-width:560px;margin:auto}body.force-mobile #cards{grid-template-columns:1fr}body.force-mobile .global{margin-left:12px;margin-right:12px}
</style></head><body><header><h1>Control Brent · petroleras</h1><p>Coherente, −1%, −2%, −3% y plan de salida</p><span id="st">Iniciando…</span></header><section class="global"><label>Brent global para las 12 compañías</label><div class="row"><input id="br" inputmode="decimal" value="88,52" oninput="all()" onchange="all()"><b>USD</b></div><button onclick="all()">↻ RECALCULAR TODAS</button><p>Un solo Brent recalcula todos los modelos activos. Pulsa cualquier nivel de incoherencia para ver objetivo superior y stop −3%.</p></section><main id="cards"></main><div id="modal" onclick="if(event.target.id==='modal')closePlan()"><div class="sheet"><h2 id="pt">Plan de salida</h2><div class="sub" id="ps">—</div><div class="plan"><div><span>Entrada</span><strong id="pe">—</strong></div><div class="tp"><span id="pl">Objetivo</span><strong id="pp">—</strong></div><div class="sl"><span>Stop −3%</span><strong id="px">—</strong></div></div><p id="pn">—</p><button onclick="closePlan()">Cerrar</button></div></div><script>

nciales y cambio de perímetro."},{"n":"International Petroleum Corp.","t":"IPCO.ST","c":"SEK","r":"manual","p":null,"q":"—","r2":"—","tag":"MULTIFACTOR · MANUAL","cl":"w","x":"WTI, WCS, AECO y divisa; Brent puro no basta."},{"n":"Afentra","t":"AET.L","c":"GBP","r":"fixed","ab":76.03,"ap":0.601,"s":0.004955141879774274,"b":0.626854304690912,"p":0.71,"q":"0,57","r2":"0,33","tag":"B · UTILIZABLE CON CAVEATS","cl":"w","x":"Financiación, liftings y menor liquidez."},{"n":"PetroTal","t":"PTAL.L","c":"GBP","r":"fixed","ab":76.03,"ap":0.255,"s":0.0012207005392883329,"b":0.3639602431454586,"p":0.255,"q":"0,42","r2":"0,18","tag":"C · RELACIÓN DÉBIL","cl":"r","x":"Logística fluvial y riesgo social pesan mucho."}],L=[],A=[],B=[];function n(v){var x=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:NaN}function f(v,d){return isFinite(v)?Number(v).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}function mon(i,v){if(!isFinite(v))return'—';return M[i].c==='GBP'?f(v*100,2)+'p':f(v,2)+' '+M[i].c}function set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}function get(k){try{return n(localStorage.getItem(k))}catch(e){return NaN}}function br(){var v=n(document.getElementById('br').value);return isFinite(v)&&v>0?v:88.52}function anchor(i){var m=M[i];if(m.r==='fixed')return{ab:m.ab,ap:m.ap,s:m.s};var a=A[i];if(m.r==='beta'&&a&&m.b>0)return{ab:a.ab,ap:a.ap,s:m.b*a.ap/a.ab};if(m.r==='manual'&&a&&isFinite(B[i])&&B[i]>0)return{ab:a.ab,ap:a.ap,s:B[i]*a.ap/a.ab};return null}function card(i){var m=M[i],p=m.p==null?'':m.p,extra='';if(m.r==='beta')extra='<div class="mb"><p>Introduce precio y fija ancla. Después el Brent global recalcula con beta '+f(m.b,2)+'.</p><button onclick="fix('+i+')">Fijar ancla</button><div class="ast" id="as'+i+'">Ancla no fijada</div></div>';if(m.r==='manual')extra='<div class="mb"><p>Modelo multifactor: introduce beta Brent aprobada y precio ancla.</p><div class="mg"><label>Beta<input id="bt'+i+'" inputmode="decimal"></label><label>Precio ancla<input id="ma'+i+'" inputmode="decimal"></label></div><button onclick="fixm('+i+')">Fijar ancla multifactor</button><div class="ast" id="as'+i+'">Ancla no fijada</div></div>';return'<article class="card"><div class="head"><div><div class="name">'+m.n+'</div><div class="tic">'+m.t+'</div></div><div class="tag '+m.cl+'">'+m.tag+'</div></div><div class="stats"><div><span>Corr.</span><b>'+m.q+'</b></div><div><span>Beta</span><b>'+(isFinite(m.b)?f(m.b,2):'—')+'</b></div><div><span>R²</span><b>'+m.r2+'</b></div></div><div class="calc"><label>Precio observado<input id="pr'+i+'" inputmode="decimal" value="'+p+'" oninput="one('+i+')"></label><div class="mirror">Brent aplicado: <b id="mi'+i+'">88,52 USD</b></div>'+extra+'<div class="levels"><div class="lv"><span>Coherente</span><strong id="c'+i+'">—</strong></div><button class="lv" onclick="plan('+i+',1)"><span>Incoherencia −1%</span><strong id="a'+i+'">—</strong><small>PULSAR</small></button><button class="lv l2" onclick="plan('+i+',2)"><span>Incoherencia −2%</span><strong id="d'+i+'">—</strong><small>PULSAR</small></button><button class="lv l3" onclick="plan('+i+',3)"><span>Incoherencia −3%</span><strong id="e'+i+'">—</strong><small>PULSAR</small></button></div><label class="news"><input id="nw'+i+'" type="checkbox" checked onchange="one('+i+')"> Sin noticia corporativa propia</label><div class="res" id="rs'+i+'">—</div><div class="pec"><b>Peculiaridad:</b> '+m.x+'</div></div></article>'}function make(){var h='';for(var i=0;i<M.length;i++)h+=card(i);document.getElementById('cards').innerHTML=h}function one(i){var b=br(),m=M[i],p=n(document.getElementById('pr'+i).value),a=anchor(i),ids=['c','a','d','e'];document.getElementById('mi'+i).textContent=f(b,2)+' USD';if(!a){L[i]=null;for(var j=0;j<4;j++)document.getElementById(ids[j]+i).textContent=j?'—':'Fija ancla';res(i,p,NaN);return}var c=a.ap+a.s*(b-a.ab),v=[c,c/1.01,c/1.02,c/1.03];L[i]=v;for(var k=0;k<4;k++)document.getElementById(ids[k]+i).textContent=mon(i,v[k]);res(i,p,c)}function res(i,p,c){var el=document.getElementById('rs'+i);if(!document.getElementById('nw'+i).checked){el.className='res sus';el.innerHTML='<b>Lectura suspendida:</b> noticia corporativa propia.';return}el.className='res';el.innerHTML=isFinite(p)&&p>0&&isFinite(c)?'Desencaje observado: <b>'+f((c/p-1)*100,2)+'%</b>.':'Introduce precio y, si procede, fija ancla.'}function all(){var b=br();document.getElementById('br').value=String(b).replace('.',',');for(var i=0;i<M.length;i++)one(i);document.getElementById('st').textContent='Calculadora activa · Brent '+f(b,2)+' USD'}function fix(i){var p=n(document.getElementById('pr'+i).value),b=br();if(!isFinite(p)||p<=0){alert('Introduce primero el precio.');return}A[i]={ab:b,ap:p};document.getElementById('as'+i).textContent='Ancla: '+mon(i,p)+' con Brent '+f(b,2);one(i)}function fixm(i){var p=n(document.getElementById('ma'+i).value),bt=n(document.getElementById('bt'+i).value),b=br();if(!isFinite(p)||p<=0||!isFinite(bt)||bt<=0){alert('Introduce beta y precio ancla válidos.');return}A[i]={ab:b,ap:p};B[i]=bt;document.getElementById('pr'+i).value=String(p).replace('.',',');document.getElementById('as'+i).textContent='Ancla activa · beta '+f(bt,2);one(i)}function plan(i,p){if(!L[i]||!isFinite(L[i][p])){alert('Nivel no calculado. Introduce precio o fija ancla.');return}var e=L[i][p],tp=e*(1+p/100),sl=e*.97;document.getElementById('pt').textContent=M[i].n+' · −'+p+'%';document.getElementById('ps').textContent=M[i].t+' · Brent '+f(br(),2)+' USD';document.getElementById('pe').textContent=mon(i,e);document.getElementById('pl').textContent='Objetivo +'+p+'%';document.getElementById('pp').textContent=mon(i,tp);document.getElementById('px').textContent=mon(i,sl);document.getElementById('pn').innerHTML='Entrada <b>'+mon(i,e)+'</b>; objetivo <b>+'+p+'%</b>; stop <b>−3%</b> desde esa entrada.';document.getElementById('modal').className='show'}function closePlan(){document.getElementById('modal').className=''}function init(){if(location.hash==='#mobile')document.body.className='force-mobile';make();all()}window.onload=init;
